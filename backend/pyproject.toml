[project]
name = "cyberops-range-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.13.3",
    "asyncpg>=0.29.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "redis[asyncio]>=5.1.0",
    "celery>=5.4.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "email-validator>=2.2.0",
    "pyyaml>=6.0.2",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",    # line length — enforced by formatter, not linter
    "F821",    # SQLAlchemy uses lazy string forward refs in relationships
    "UP046",   # CRUDBase[T] generic pattern is idiomatic for SQLAlchemy CRUD
    "UP042",   # str+Enum works in 3.12; StrEnum migration is out of scope
]

[tool.ruff.lint.per-file-ignores]
"app/crud/__init__.py" = ["F401"]       # intentional re-exports
"app/services/__init__.py" = ["F401"]   # intentional re-exports

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.6.0",
]
