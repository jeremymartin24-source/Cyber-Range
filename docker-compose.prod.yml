services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend

  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    command: node server.js
    environment:
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 512M
